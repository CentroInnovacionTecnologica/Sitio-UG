<header class="ug-navbar" [class.ug-navbar--scrolled]="isScrolled">
  <div class="ug-navbar__container">

    <!-- ===============================
         LOGO / MARCA
         =============================== -->
    <a routerLink="/" class="ug-navbar__logo" (click)="closeMenu()">
      <span class="ug-navbar__logo-mark">UG</span>
      <span class="ug-navbar__logo-text">UNIFORMES ESCOLARES E INDUSTRIALES</span>
    </a>

    <!-- ===============================
         MENÚ DESKTOP
         =============================== -->
    <nav class="ug-navbar__desktop">
      <a routerLink="/" routerLinkActive="ug-navbar__link--active" [routerLinkActiveOptions]="{ exact: true }"
        class="ug-navbar__link">
        INICIO
      </a>

      <a routerLink="/nosotros" routerLinkActive="ug-navbar__link--active" class="ug-navbar__link">
        NOSOTROS
      </a>

      <div class="ug-navbar__dropdown">

        <a routerLink="/productos" routerLinkActive="ug-navbar__link--active" class="ug-navbar__link">
          PRODUCTOS
        </a>

        <div class="ug-navbar__dropdown-menu">
          @for (cat of categorias; track cat.slug) {
          <a [routerLink]="['/productos', cat.slug]" (click)="closeMenu()">
            {{ cat.nombre }}
          </a>
          }
        </div>

      </div>

      <a routerLink="/contacto" routerLinkActive="ug-navbar__link--active" class="ug-navbar__link">
        CONTACTO
      </a>

      <a routerLink="/cotizar" class="ug-navbar__cta">
        COTIZAR
      </a>
    </nav>

    <!-- ===============================
         BOTÓN MENÚ MÓVIL
         =============================== -->
    <button class="ug-navbar__toggle" type="button" (click)="toggleMenu()" aria-label="Abrir menú">
      <span [class.active]="menuOpen"></span>
      <span [class.active]="menuOpen"></span>
      <span [class.active]="menuOpen"></span>
    </button>
  </div>

  <!-- ===============================
       MENÚ MOBILE
       =============================== -->
  <div class="ug-navbar__mobile" [class.ug-navbar__mobile--open]="menuOpen">
    <a routerLink="/" (click)="closeMenu()">INICIO</a>
    <a routerLink="/productos" (click)="closeMenu()">PRODUCTOS</a>
    <a routerLink="/nosotros" (click)="closeMenu()">NOSOTROS</a>
    <a routerLink="/contacto" (click)="closeMenu()">CONTACTO</a>
    <a routerLink="/contacto" (click)="closeMenu()">COTIZAR</a>
  </div>
</header>
